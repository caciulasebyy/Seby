<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seby's Music</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animația de fundal cu linii aurii verticali */
        .lines-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 1;
            pointer-events: none;
        }

        .line {
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(212, 175, 55, 0.25), transparent);
            animation: moveLines 4s ease-in-out infinite alternate;
        }

        .line:nth-child(2n) {
            animation-delay: 1s;
        }

        .line:nth-child(3n) {
            animation-delay: 2s;
        }

        @keyframes moveLines {
            0% { transform: translateY(-10%); opacity: 0.2; }
            100% { transform: translateY(10%); opacity: 0.8; }
        }

        /* Cardul principal din mijloc */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 380px;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .profile-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
            letter-spacing: 1px;
        }

        p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 25px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            background: rgba(30, 30, 30, 0.9);
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <!-- Liniile animate din fundal -->
    <div class="lines-bg">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <!-- Caseta din mijloc -->
    <div class="card">
        <!-- Daca nu se incarca poza ta locala, va afisa logo-ul de la YouTube/Muzica -->
        <img src="logo.jpg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1384/1384060.png'" alt="Seby's Music" class="profile-img">
        
        <h1>Seby's Music</h1>
        <p>Official Links & Releases</p>

        <a href="https://youtu.be/WB_zDJIq8wk" target="_blank" class="btn">
            🎬 F.M.R.N - Capitol incheiat
        </a>

        <a href="https://www.youtube.com/@SebyCăciMusic" target="_blank" class="btn">
            📺 Canal YouTube (@SebyCăciMusic)
        </a>
    </div>

</body>
</html>
