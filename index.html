<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seby Căci - Official Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px 0;
        }

        /* Fundal cu egalizator animat */
        .equalizer-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            opacity: 0.12;
            z-index: 1;
            pointer-events: none;
            padding: 0 10px;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #d4af37, #fff);
            height: 20%;
            border-radius: 4px;
            animation: bounce 1.2s ease-in-out infinite alternate;
        }

        .bar:nth-child(2n) { animation-duration: 0.8s; }
        .bar:nth-child(3n) { animation-duration: 1.5s; }
        .bar:nth-child(4n) { animation-duration: 1.1s; }
        .bar:nth-child(5n) { animation-duration: 0.9s; }

        @keyframes bounce {
            0% { height: 10%; }
            100% { height: 85%; }
        }

        /* Animație pentru Note Muzicale Căzătoare */
        .falling-notes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .note {
            position: absolute;
            top: -50px;
            font-size: 20px;
            opacity: 0.4;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Container Card */
        .container {
            width: 90%;
            max-width: 420px;
            background: rgba(18, 18, 18, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 24px;
            padding: 40px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.1);
            text-align: center;
            z-index: 2;
            position: relative;
        }

        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            display: block;
        }

        .badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: #d4af37;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Animație Cădere Nume */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            animation: dropTitle 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dropTitle {
            0% {
                opacity: 0;
                transform: translateY(-80px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle {
            font-size: 12px;
            color: #a0a0a0;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 30, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-left svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .arrow {
            color: #d4af37;
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .link-card:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .link-card:hover .arrow {
            transform: translateX(4px);
        }

        footer {
            margin-top: 35px;
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

        <div class="bar"></div>

        <div class="bar"></div>

        <footer>
            &copy; SEBY CĂCI &bull; ALL RIGHTS RESERVED
        </footer>
    </div>

    <!-- Script Generare Note Muzicale -->
    <script>
        const symbols = ['🎵', '🎶', '🔊', '🎼', '🎹'];
        const container = document.getElementById('notesContainer');

        function createNote() {
            const note = document.createElement('div');
            note.classList.add('note');
            note.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            note.style.left = Math.random() * 100 + 'vw';
            note.style.animationDuration = (Math.random() * 3 + 3) + 's'; // între 3s și 6s
            note.style.fontSize = (Math.random() * 15 + 16) + 'px'; // între 16px și 31px
            
            container.appendChild(note);

            setTimeout(() => {
                note.remove();
            }, 6000);
        }

        setInterval(createNote, 400);
    </script>
</body>
</html>
